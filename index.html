// ===== IMAGE COMPRESS HELPER =====
function compressImg(file, maxW = 1000, quality = 0.75) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const ratio = Math.min(maxW / img.width, 1);
        canvas.width = img.width * ratio;
        canvas.height = img.height * ratio;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ===== STORY CREATOR =====
function StoryCreator({ me, onClose, showToast }) {
  const [imgData, setImgData] = useState('');
  const [storyText, setStoryText] = useState('');
  const [textColor, setTextColor] = useState('#ffffff');
  const [bgColor, setBgColor] = useState('linear-gradient(135deg,#7C4DFF,#ff6b9d)');
  const [posting, setPosting] = useState(false);
  const fileRef = useRef(null);
  const colors = ['#ffffff','#ffeb3b','#ff6b9d','#4fc3f7','#81c784','#ff9800','#e91e63'];
  const bgs = [
    'linear-gradient(135deg,#7C4DFF,#ff6b9d)',
    'linear-gradient(135deg,#f06292,#ce93d8)',
    'linear-gradient(135deg,#4fc3f7,#81d4fa)',
    'linear-gradient(135deg,#81c784,#a5d6a7)',
    'linear-gradient(135deg,#ffb74d,#ff8a65)',
    'linear-gradient(135deg,#1a1a2e,#16213e)',
  ];

  const pickImg = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const b64 = await compressImg(f, 900, 0.8);
    setImgData(b64);
  };

  const post = async () => {
    if (!imgData && !storyText.trim()) { showToast('❌ Add a photo or text'); return; }
    setPosting(true);
    try {
      await db.collection('stories').add({
        authorId: me.uid, authorName: me.name, authorPhoto: me.photoURL || '',
        imageData: imgData, text: storyText.trim(), textColor,
        bgColor: imgData ? '' : bgColor,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        expiresAt: new Date(Date.now() + 24 * 60 * 60 * 1000),
        views: []
      });
      showToast('✅ Story posted!');
      onClose();
    } catch(e) { showToast('❌ Failed: ' + e.message); }
    setPosting(false);
  };

  return (
    <div className="story-creator">
      {/* Header */}
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'14px 16px', background:'rgba(0,0,0,0.7)' }}>
        <div onClick={onClose} style={{ color:'#fff', cursor:'pointer', fontSize:22, width:36, height:36, display:'flex', alignItems:'center', justifyContent:'center' }}>✕</div>
        <span style={{ color:'#fff', fontWeight:800, fontSize:16 }}>📖 Create Story</span>
        <button onClick={post} disabled={posting} style={{ background:'linear-gradient(135deg,#7C4DFF,#ff6b9d)', color:'#fff', border:'none', borderRadius:20, padding:'8px 18px', fontFamily:'Poppins', fontWeight:700, fontSize:13, cursor:'pointer' }}>
          {posting ? '...' : 'Share'}
        </button>
      </div>

      {/* Canvas */}
      <div className="story-creator-canvas" style={{ background: imgData ? '#000' : bgColor }}>
        {imgData
          ? <img src={imgData} className="story-viewer-img" />
          : <div style={{ textAlign:'center', padding:30 }}>
              <div style={{ fontSize:60, marginBottom:16 }}>📸</div>
              <div style={{ color:'rgba(255,255,255,0.5)', fontSize:14 }}>No photo — text only story</div>
            </div>
        }
        {storyText && (
          <div style={{ position:'absolute', bottom:20, left:0, right:0, padding:'0 20px', textAlign:'center' }}>
            <div style={{ background:'rgba(0,0,0,0.55)', borderRadius:16, padding:'10px 16px', display:'inline-block', color:textColor, fontSize:18, fontWeight:700, lineHeight:1.4, maxWidth:'90%', wordBreak:'break-word' }}>{storyText}</div>
          </div>
        )}
      </div>

      {/* Toolbar */}
      <div style={{ background:'rgba(0,0,0,0.85)', padding:'10px 16px 20px' }}>
        {/* Text input */}
        <input className="story-text-input" placeholder="Add text to your story..." value={storyText} onChange={e => setStoryText(e.target.value)} style={{ marginBottom:10 }} />

        {/* Text colors */}
        <div style={{ display:'flex', gap:8, marginBottom:10, alignItems:'center' }}>
          <span style={{ color:'#aaa', fontSize:11, fontWeight:600, width:40 }}>Text</span>
          {colors.map(c => (
            <div key={c} onClick={() => setTextColor(c)} style={{ width:24, height:24, borderRadius:'50%', background:c, border: textColor===c ? '2.5px solid #fff' : '2px solid rgba(255,255,255,0.2)', cursor:'pointer', flexShrink:0, boxShadow: textColor===c ? '0 0 0 2px #7C4DFF' : 'none' }} />
          ))}
        </div>

        {/* BG colors (only when no image) */}
        {!imgData && (
          <div style={{ display:'flex', gap:8, marginBottom:10, alignItems:'center', overflowX:'auto' }}>
            <span style={{ color:'#aaa', fontSize:11, fontWeight:600, width:40, flexShrink:0 }}>BG</span>
            {bgs.map((b,i) => (
              <div key={i} onClick={() => setBgColor(b)} style={{ width:28, height:28, borderRadius:8, background:b, border: bgColor===b ? '2.5px solid #fff' : '2px solid rgba(255,255,255,0.2)', cursor:'pointer', flexShrink:0, boxShadow: bgColor===b ? '0 0 0 2px #7C4DFF' : 'none' }} />
            ))}
          </div>
        )}

        {/* Action buttons */}
        <div style={{ display:'flex', gap:10 }}>
          <label style={{ flex:1, cursor:'pointer' }}>
            <input ref={fileRef} type="file" accept="image/*" style={{ display:'none' }} onChange={pickImg} />
            <div style={{ background:'rgba(255,255,255,0.12)', border:'1.5px solid rgba(255,255,255,0.25)', borderRadius:14, padding:'11px', textAlign:'center', color:'#fff', fontSize:13, fontWeight:600 }}>
              📷 {imgData ? 'Change Photo' : 'Add Photo'}
            </div>
          </label>
          {imgData && (
            <div onClick={() => setImgData('')} style={{ background:'rgba(229,57,53,0.2)', border:'1.5px solid #e53935', borderRadius:14, padding:'11px 16px', color:'#e53935', fontSize:13, fontWeight:600, cursor:'pointer' }}>🗑️</div>
          )}
        </div>
      </div>
    </div>
  );
}

// ===== STORY VIEWER =====
function StoryViewer({ stories, startIdx, me, onClose }) {
  const [idx, setIdx] = useState(startIdx);
  const [progress, setProgress] = useState(0);
  const timerRef = useRef(null);
  const story = stories[idx];
  const DURATION = 5000;

  useEffect(() => {
    setProgress(0);
    const start = Date.now();
    timerRef.current = setInterval(() => {
      const p = Math.min(100, ((Date.now() - start) / DURATION) * 100);
      setProgress(p);
      if (p >= 100) { clearInterval(timerRef.current); goNext(); }
    }, 80);
    // mark view
    if (story && me && !story.views?.includes(me.uid)) {
      db.collection('stories').doc(story.id).update({ views: firebase.firestore.FieldValue.arrayUnion(me.uid) }).catch(() => {});
    }
    return () => clearInterval(timerRef.current);
  }, [idx]);

  const goNext = () => { if (idx < stories.length - 1) setIdx(i => i + 1); else onClose(); };
  const goPrev = () => { if (idx > 0) setIdx(i => i - 1); };

  if (!story) return null;
  return (
    <div className="story-viewer" onClick={e => e.stopPropagation()}>
      {/* Progress bars */}
      <div className="story-progress-bar">
        {stories.map((_, i) => (
          <div key={i} className="story-seg">
            <div className="story-seg-fill" style={{ width: i < idx ? '100%' : i === idx ? progress + '%' : '0%' }} />
          </div>
        ))}
      </div>
      {/* Header */}
      <div className="story-viewer-head">
        <div style={{ width:36, height:36, borderRadius:'50%', background:'linear-gradient(135deg,#7C4DFF,#ff6b9d)', overflow:'hidden', flexShrink:0 }}>
          {story.authorPhoto ? <img src={story.authorPhoto} style={{ width:'100%', height:'100%', objectFit:'cover' }} /> : <div style={{ width:'100%', height:'100%', display:'flex', alignItems:'center', justifyContent:'center', color:'#fff', fontWeight:700 }}>{(story.authorName||'?')[0]}</div>}
        </div>
        <div style={{ flex:1 }}>
          <div style={{ color:'#fff', fontWeight:700, fontSize:14 }}>{story.authorName}</div>
          <div style={{ color:'rgba(255,255,255,0.65)', fontSize:11 }}>{timeAgo(story.createdAt)}</div>
        </div>
        <div onClick={onClose} style={{ color:'#fff', fontSize:24, cursor:'pointer', padding:'0 4px' }}>✕</div>
      </div>
      {/* Body */}
      <div className="story-viewer-body" style={{ background: story.bgColor || '#000' }}>
        {story.imageData && <img src={story.imageData} className="story-viewer-img" />}
        {story.text && (
          <div className="story-viewer-text">
            <span style={{ color: story.textColor || '#fff', textShadow:'0 2px 8px rgba(0,0,0,0.8)' }}>{story.text}</span>
          </div>
        )}
        <div className="story-viewer-tap-left" onClick={goPrev} />
        <div className="story-viewer-tap-right" onClick={goNext} />
      </div>
      {/* Views count */}
      <div style={{ background:'rgba(0,0,0,0.6)', padding:'10px 20px', display:'flex', alignItems:'center', gap:6 }}>
        <span style={{ fontSize:16 }}>👁️</span>
        <span style={{ color:'rgba(255,255,255,0.8)', fontSize:13 }}>{(story.views||[]).length} views</span>
      </div>
    </div>
  );
}

// ===== HOME PAGE =====
function HomePage({ me, onViewProfile, showToast, setTab, notifCount }) {
  const { t } = useLang();
  const [posts, setPosts] = useState([]);
  const [users, setUsers] = useState({});
  const [newPost, setNewPost] = useState('');
  const [postImgs, setPostImgs] = useState([]);
  const [posting, setPosting] = useState(false);
  const [showCreator, setShowCreator] = useState(false);
  const [viewingStories, setViewingStories] = useState(null);
  const [allStories, setAllStories] = useState([]);
  const [showNotifDrop, setShowNotifDrop] = useState(false);
  const [showDotMenu, setShowDotMenu] = useState(false);
  const [notifItems, setNotifItems] = useState([]);
  const postImgRef = useRef(null);

  // Load notifications (friend requests)
  useEffect(() => {
    if (!me?.uid) return;
    const reqs = me.friendRequests || [];
    if (!reqs.length) { setNotifItems([]); return; }
    Promise.all(reqs.map(uid =>
      db.collection('users').doc(uid).get().then(s => s.exists ? ({ uid, name: s.data().name, photo: s.data().photoURL, userData: s.data() }) : null)
    )).then(items => setNotifItems(items.filter(Boolean)));
  }, [me?.friendRequests]);

  const acceptReq = async (item, e) => {
    e.stopPropagation();
    const batch = db.batch();
    batch.update(db.collection('users').doc(me.uid), {
      friends: firebase.firestore.FieldValue.arrayUnion(item.uid),
      friendRequests: firebase.firestore.FieldValue.arrayRemove(item.uid),
    });
    batch.update(db.collection('users').doc(item.uid), {
      friends: firebase.firestore.FieldValue.arrayUnion(me.uid),
      sentRequests: firebase.firestore.FieldValue.arrayRemove(me.uid),
    });
    await batch.commit();
    showToast('✅ Friend accepted!');
  };

  const declineReq = async (item, e) => {
    e.stopPropagation();
    await db.collection('users').doc(me.uid).update({ friendRequests: firebase.firestore.FieldValue.arrayRemove(item.uid) });
    await db.collection('users').doc(item.uid).update({ sentRequests: firebase.firestore.FieldValue.arrayRemove(me.uid) });
    showToast('Declined');
  };

  // Load posts
  useEffect(() => {
    const unsub = db.collection('posts').orderBy('createdAt', 'desc').limit(30).onSnapshot(snap => {
      const ps = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      setPosts(ps);
      const uids = [...new Set(ps.map(p => p.authorId).filter(Boolean))];
      uids.forEach(uid => {
        if (!users[uid]) db.collection('users').doc(uid).get().then(s => {
          if (s.exists) setUsers(prev => ({ ...prev, [uid]: s.data() }));
        });
      });
    });
    return unsub;
  }, []);

  // Load stories (last 24h)
  useEffect(() => {
    const cutoff = new Date(Date.now() - 24*60*60*1000);
    const unsub = db.collection('stories').where('createdAt', '>', cutoff).orderBy('createdAt','desc').onSnapshot(snap => {
      setAllStories(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    });
    return unsub;
  }, []);

  // Group stories by author
  const myStories = allStories.filter(s => s.authorId === me?.uid);
  const friendIds = me?.friends || [];
  // unique friend authors who have stories
  const friendStoryAuthors = [...new Map(
    allStories.filter(s => s.authorId !== me?.uid && (friendIds.includes(s.authorId) || true))
      .map(s => [s.authorId, s])
  ).values()];

  const openStory = (authorId) => {
    const group = allStories.filter(s => s.authorId === authorId);
    if (group.length) setViewingStories({ stories: group, startIdx: 0 });
  };

  const createPost = async () => {
    if (!newPost.trim() && postImgs.length === 0) return;
    if (!me) return;
    setPosting(true);
    await db.collection('posts').add({
      authorId: me.uid, text: newPost.trim(),
      images: postImgs, // array of base64
      imageURL: postImgs[0] || '', // backward compat
      likes: [], commentCount: 0,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    setNewPost(''); setPostImgs([]); setPosting(false);
    showToast('✅ Post shared!');
  };

  const pickPostImgs = async (e) => {
    const files = Array.from(e.target.files).slice(0, 6);
    const compressed = await Promise.all(files.map(f => compressImg(f, 1000, 0.75)));
    setPostImgs(prev => [...prev, ...compressed].slice(0, 6));
    e.target.value = '';
  };

  const toggleLike = async (post) => {
    const liked = post.likes?.includes(me.uid);
    await db.collection('posts').doc(post.id).update({
      likes: liked ? firebase.firestore.FieldValue.arrayRemove(me.uid) : firebase.firestore.FieldValue.arrayUnion(me.uid)
    });
  };

  const PostImages = ({ images }) => {
    const imgs = images?.length ? images : [];
    if (!imgs.length) return null;
    const n = imgs.length;
    if (n === 1) return (
      <div className="post-img-grid n1"><div className="post-img-cell" style={{ aspectRatio:'4/3' }}><img src={imgs[0]} /></div></div>
    );
    if (n === 2) return (
      <div className="post-img-grid n2">{imgs.map((s,i) => <div key={i} className="post-img-cell tall"><img src={s} /></div>)}</div>
    );
    if (n === 3) return (
      <div className="post-img-grid n3">
        <div className="post-img-cell span2"><img src={imgs[0]} /></div>
        <div className="post-img-cell tall"><img src={imgs[1]} /></div>
        <div className="post-img-cell tall"><img src={imgs[2]} /></div>
      </div>
    );
    return (
      <div className="post-img-grid n4plus">
        {imgs.slice(0,3).map((s,i) => <div key={i} className="post-img-cell tall"><img src={s} /></div>)}
        <div className="post-img-cell post-img-more">+{n-3}</div>
      </div>
    );
  };

  return (
    <div>
      {showCreator && <StoryCreator me={me} onClose={() => setShowCreator(false)} showToast={showToast} />}
      {viewingStories && <StoryViewer stories={viewingStories.stories} startIdx={viewingStories.startIdx} me={me} onClose={() => setViewingStories(null)} />}

      {/* Overlay to close dropdowns */}
      {(showNotifDrop || showDotMenu) && (
        <div style={{ position:'fixed', inset:0, zIndex:299 }} onClick={() => { setShowNotifDrop(false); setShowDotMenu(false); }} />
      )}

      {/* Notification Dropdown */}
      {showNotifDrop && (
        <div className="notif-dropdown">
          <div className="notif-dropdown-head">
            <span style={{ fontWeight:800, fontSize:15, color:'#1a1a2e' }}>🔔 Notifications</span>
            {notifItems.length > 0 && <span style={{ fontSize:11, background:'#7C4DFF', color:'#fff', borderRadius:20, padding:'2px 9px', fontWeight:700 }}>{notifItems.length} new</span>}
          </div>
          <div className="notif-dropdown-body">
            {notifItems.length === 0 ? (
              <div style={{ textAlign:'center', padding:'32px 16px', color:'#9ca3af', fontSize:13 }}>
                <div style={{ fontSize:36, marginBottom:8 }}>🔔</div>
                No new notifications
              </div>
            ) : notifItems.map(item => (
              <div key={item.uid} className="notif-row unread">
                <div className="notif-avatar">
                  {item.photo ? <img src={item.photo} style={{ width:'100%', height:'100%', objectFit:'cover' }} /> : (item.name||'?')[0]}
                </div>
                <div className="notif-content">
                  <div className="notif-content-name">{item.name}</div>
                  <div className="notif-content-text">sent you a friend request 👥</div>
                  <div className="notif-content-actions">
                    <button className="notif-btn-accept" onClick={e => acceptReq(item, e)}>✅ Accept</button>
                    <button className="notif-btn-decline" onClick={e => declineReq(item, e)}>✕ Decline</button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* 3-dot Menu */}
      {showDotMenu && (
        <div className="dots-menu">
          <div className="dots-menu-item" onClick={() => { setShowDotMenu(false); setTab('profile'); }}>
            <span style={{ fontSize:18 }}>👤</span> {t.myProfile}
          </div>
          <div className="dots-menu-item" onClick={() => { setShowDotMenu(false); setTab('friends'); }}>
            <span style={{ fontSize:18 }}>👥</span> {t.friends}
          </div>
          <div className="dots-menu-item" onClick={() => { setShowDotMenu(false); setTab('search'); }}>
            <span style={{ fontSize:18 }}>🔍</span> {t.searchPeople}
          </div>
          <div className="dots-menu-divider" />
          <div className="dots-menu-item" onClick={() => { setShowDotMenu(false); setTab('settings'); }}>
            <span style={{ fontSize:18 }}>⚙️</span> {t.settings}
          </div>
          <div className="dots-menu-item" onClick={() => { setShowDotMenu(false); setSection && setSection('about'); setTab('settings'); }}>
            <span style={{ fontSize:18 }}>ℹ️</span> {t.about}
          </div>
          <div className="dots-menu-divider" />
          <div className="dots-menu-item danger" onClick={() => { setShowDotMenu(false); auth.signOut(); }}>
            <span style={{ fontSize:18 }}>🚪</span> Log Out
          </div>
        </div>
      )}

      {/* Topbar */}
      <div className="topbar" style={{ position:'sticky', top:0, zIndex:100 }}>
        <span className="topbar-logo"><TwinLogo size={28} textSize={18} /></span>
        <div className="topbar-icons">
          <div className="icon-btn" onClick={() => setShowCreator(true)}>📷</div>
          <div className="icon-btn" onClick={() => { setShowNotifDrop(v => !v); setShowDotMenu(false); }} style={{ position:'relative' }}>
            🔔
            {notifCount > 0 && <div className="notif-badge">{notifCount > 9 ? '9+' : notifCount}</div>}
          </div>
          <div className="icon-btn" onClick={() => { setShowDotMenu(v => !v); setShowNotifDrop(false); }} style={{ fontSize:20, fontWeight:800, letterSpacing:1 }}>⋮</div>
        </div>
      </div>
      <div className="page-content">
        {/* Stories */}
        <div className="stories">
          {/* My story button */}
          <div className="story-item" onClick={() => myStories.length ? openStory(me.uid) : setShowCreator(true)}>
            <div className={`story-ring ${myStories.length ? '' : 'you'}`} style={{ position:'relative' }}>
              <div className="story-avatar">
                {me?.photoURL ? <img src={me.photoURL} style={{ width:'100%', height:'100%', objectFit:'cover', borderRadius:'50%' }} /> : (me?.name||'?')[0]}
              </div>
              {!myStories.length && <div className="story-add">+</div>}
            </div>
            <span className="story-name">You</span>
          </div>
          {/* Friends stories */}
          {friendStoryAuthors.map((s, i) => (
            <div key={s.authorId||i} className="story-item" onClick={() => openStory(s.authorId)}>
              <div className="story-ring">
                <div className="story-avatar">
                  {s.authorPhoto ? <img src={s.authorPhoto} style={{ width:'100%', height:'100%', objectFit:'cover', borderRadius:'50%' }} /> : (s.authorName||'?')[0]}
                </div>
              </div>
              <span className="story-name">{s.authorName}</span>
            </div>
          ))}
        </div>

        {/* Create Post */}
        <div style={{ background:'#fff', padding:'12px 16px 8px', borderBottom:'8px solid #f0f4ff' }}>
          <div style={{ display:'flex', gap:10, alignItems:'flex-end' }}>
            <Avatar user={me} size={38} />
            <div style={{ flex:1 }}>
              <input className="inp" style={{ borderRadius:20, padding:'9px 16px', fontSize:13 }}
                placeholder={t.whatsOnMind}
                value={newPost} onChange={e => setNewPost(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && createPost()} />
            </div>
          </div>
          {/* Image previews */}
          {postImgs.length > 0 && (
            <div className="img-preview-strip" style={{ marginTop:8 }}>
              {postImgs.map((src, i) => (
                <div key={i} className="img-preview-item">
                  <img src={src} />
                  <div className="img-preview-rm" onClick={() => setPostImgs(p => p.filter((_,j) => j!==i))}>✕</div>
                </div>
              ))}
              {postImgs.length < 6 && (
                <label style={{ width:60, height:60, borderRadius:10, background:'#ede7ff', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', flexShrink:0, fontSize:22, border:'2px dashed #7C4DFF' }}>
                  <input type="file" accept="image/*" multiple style={{ display:'none' }} onChange={pickPostImgs} />+
                </label>
              )}
            </div>
          )}
          {/* Action row */}
          <div style={{ display:'flex', gap:8, marginTop:8, alignItems:'center' }}>
            <label style={{ cursor:'pointer', display:'flex', alignItems:'center', gap:5, color:'#7C4DFF', fontSize:12, fontWeight:600, background:'#ede7ff', borderRadius:20, padding:'6px 12px' }}>
              <input ref={postImgRef} type="file" accept="image/*" multiple style={{ display:'none' }} onChange={pickPostImgs} />
              📷 Photo
            </label>
            <div style={{ flex:1 }} />
            <button onClick={createPost} disabled={posting || (!newPost.trim() && !postImgs.length)} style={{ background:'linear-gradient(135deg,#7C4DFF,#ff6b9d)', border:'none', borderRadius:12, padding:'8px 20px', color:'#fff', fontFamily:'Poppins', fontWeight:700, fontSize:13, cursor:'pointer', opacity: (posting||(!newPost.trim()&&!postImgs.length)) ? 0.6 : 1 }}>
              {posting ? '...' : 'Post'}
            </button>
          </div>
        </div>

        {/* Feed */}
        {posts.map(post => {
          const author = users[post.authorId] || {};
          const liked = post.likes?.includes(me?.uid);
          const imgs = post.images?.length ? post.images : (post.imageURL ? [post.imageURL] : []);
          return (
            <div key={post.id} className="post-card">
              <div className="post-head">
                <div className="post-avatar" onClick={() => author.uid && onViewProfile(author)} style={{ cursor:'pointer' }}>
                  <Avatar user={author} size={42} />
                </div>
                <div className="post-info">
                  <div className="post-author">{author.name || 'User'}</div>
                  <div className="post-loc">{timeAgo(post.createdAt)}</div>
                </div>
                <div className="post-menu-btn">···</div>
              </div>
              {post.text && <div className="post-text">{post.text}</div>}
              <PostImages images={imgs} />
              <div className="post-actions">
                <div className={`action-btn ${liked ? 'liked' : ''}`} onClick={() => toggleLike(post)}>
                  <Icon name="heart" size={18} color={liked ? '#ff6b9d' : '#9ca3af'} />
                  <span>{post.likes?.length || 0}</span>
                </div>
                <div className="action-btn">
                  <Icon name="comment" size={18} color="#9ca3af" />
                  <span>{post.commentCount || 0}</span>
                </div>
                <div className="action-btn">
                  <Icon name="share" size={18} color="#9ca3af" />
                  <span>{post.shareCount || 0}</span>
                </div>
              </div>
            </div>
          );
        })}
        {posts.length === 0 && (
          <div className="empty-state">
            <div className="emoji">📝</div>
            <p>No posts yet. Be the first!</p>
          </div>
        )}
      </div>
    </div>
  );
}

// ===== SEARCH PAGE =====
function SearchPage({ me, showToast, onViewProfile }) {
  const [query, setQuery] = useState('');
  const [results, setResults] = useState([]);
  const [searching, setSearching] = useState(false);

  const search = async (q) => {
    if (!q.trim()) { setResults([]); return; }
    setSearching(true);
    const snap = await db.collection('users').get();
    const all = snap.docs.map(d => d.data()).filter(u => u.uid !== me.uid);
    const q2 = q.toLowerCase();
    setResults(all.filter(u => (u.name || '').toLowerCase().includes(q2) || (u.email || '').toLowerCase().includes(q2)));
    setSearching(false);
  };

  useEffect(() => {
    const t = setTimeout(() => search(query), 400);
    return () => clearTimeout(t);
  }, [query]);

  const sendRequest = async (user) => {
    if ((me.sentRequests || []).includes(user.uid)) return;
    if ((me.friends || []).includes(user.uid)) return;
    const batch = db.batch();
    batch.update(db.collection('users').doc(me.uid), { sentRequests: firebase.firestore.FieldValue.arrayUnion(user.uid) });
    batch.update(db.collection('users').doc(user.uid), { friendRequests: firebase.firestore.FieldValue.arrayUnion(me.uid) });
    await batch.commit();
    showToast(`✅ Friend request sent to ${user.name}`);
  };

  const getStatus = (user) => {
    if ((me.friends || []).includes(user.uid)) return 'friends';
    if ((me.sentRequests || []).includes(user.uid)) return 'sent';
    if ((me.friendRequests || []).includes(user.uid)) return 'received';
    return 'none';
  };

  return (
    <div>
      <div className="topbar"><span className="topbar-logo">Search</span></div>
      <div className="search-bar-wrap">
        <div className="search-bar">
          <Icon name="search" size={16} color="#9ca3af" />
          <input placeholder="Search people by name or email..." value={query} onChange={e => setQuery(e.target.value)} autoFocus />
          {query && <span onClick={() => setQuery('')} style={{ cursor: 'pointer', color: '#9ca3af' }}>✕</span>}
        </div>
      </div>
      <div className="page-content">
        {searching && <div style={{ textAlign: 'center', padding: 24, color: '#9ca3af', fontSize: 13 }}>Searching...</div>}
        {results.map(user => {
          const status = getStatus(user);
          return (
            <div key={user.uid} className="search-result-item" onClick={() => onViewProfile(user)}>
              <Avatar user={user} size={46} />
              <div className="search-result-info">
                <div className="search-result-name">{user.name}</div>
                <div className="search-result-meta">{(user.friends || []).length} friends</div>
              </div>
              {status === 'friends' && <span className="btn-added">Friends ✓</span>}
              {status === 'sent' && <span className="btn-added">Requested</span>}
              {status === 'received' && <span className="btn-added">Received</span>}
              {status === 'none' && (
                <button className="btn-add" onClick={e => { e.stopPropagation(); sendRequest(user); }}>+ Add</button>
              )}
            </div>
          );
        })}
        {query && results.length === 0 && !searching && (
          <div className="empty-state"><div className="emoji">🔍</div><p>No users found for "{query}"</p></div>
        )}
        {!query && (
          <div className="empty-state"><div className="emoji">👥</div><p>Search for people to connect</p></div>
        )}
      </div>
    </div>
  );
}

// ===== MESSAGES PAGE =====
function MessagesPage({ me, onChatOpen }) {
  const [convos, setConvos] = useState([]);
  const [friends, setFriends] = useState([]);

  useEffect(() => {
    if (!me) return;
    const fids = me.friends || [];
    if (fids.length === 0) return;
    Promise.all(fids.map(uid => db.collection('users').doc(uid).get())).then(snaps => {
      setFriends(snaps.map(s => s.data()).filter(Boolean));
    });
  }, [me]);

  return (
    <div>
      <div className="topbar"><span className="topbar-logo">Messages</span></div>
      <div className="search-bar-wrap">
        <div className="search-bar">
          <Icon name="search" size={16} color="#9ca3af" />
          <input placeholder="Search conversations..." />
        </div>
      </div>
      <div className="page-content">
        {friends.length === 0 ? (
          <div className="empty-state"><div className="emoji">💬</div><p>Add friends to start chatting</p></div>
        ) : (
          friends.map(f => (
            <div key={f.uid} className="msg-list-item" onClick={() => onChatOpen(f)}>
              <div className="msg-list-avatar">
                <Avatar user={f} size={50} />
                <div className="online-dot" />
              </div>
              <div className="msg-list-info">
                <div className="msg-list-name">{f.name}</div>
                <div className="msg-list-preview">Tap to start chatting</div>
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 4 }}>
                <div className="msg-list-time">Now</div>
              </div>
            </div>
          ))
        )}
      </div>
    </div>
  );
}

// ===== CHAT WINDOW - WhatsApp Style =====
const EMOJIS = ['😀','😂','🥰','😍','😎','🤩','😭','😤','🥺','😏','👍','👎','❤️','🔥','✨','🎉','💯','🙏','👏','🤝','😊','😢','😡','🤔','💪','🎵','🌹','💐','🦋','⭐','🌙','☀️','🍎','🍕','☕','🎮','📱','💬','📸','🌍'];

function ChatWindow({ me, other, onBack, showToast }) {
  const [messages, setMessages] = useState([]);
  const [text, setText] = useState('');
  const [sending, setSending] = useState(false);
  const [showEmoji, setShowEmoji] = useState(false);
  const [typing, setTyping] = useState(false);
  const [msgMenu, setMsgMenu] = useState(null); // { id, text }
  const [editingMsg, setEditingMsg] = useState(null); // { id, text }
  const [pendingImgs, setPendingImgs] = useState([]); // images to send
  const imgInputRef = useRef(null);
  const bottomRef = useRef(null);
  const inputRef = useRef(null);
  const chatId = [me.uid, other.uid].sort().join('_');

  useEffect(() => {
    const unsub = db.collection('chats').doc(chatId).collection('messages')
      .orderBy('createdAt').onSnapshot(snap => {
        setMessages(snap.docs.map(d => ({ id: d.id, ...d.data() })));
      });
    return unsub;
  }, [chatId]);

  useEffect(() => {
    setTimeout(() => bottomRef.current?.scrollIntoView({ behavior: 'smooth' }), 80);
  }, [messages]);

  const sendMsg = async () => {
    const t = text.trim();
    if (!t && pendingImgs.length === 0) return;
    if (sending) return;
    setSending(true);
    setText('');
    setShowEmoji(false);
    const batch = db.batch();
    // Send each image as separate message
    for (const imgData of pendingImgs) {
      const ref = db.collection('chats').doc(chatId).collection('messages').doc();
      batch.set(ref, { senderId: me.uid, imageData: imgData, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    }
    // Send text message if any
    if (t) {
      const ref = db.collection('chats').doc(chatId).collection('messages').doc();
      batch.set(ref, { senderId: me.uid, text: t, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    }
    await batch.commit();
    await db.collection('chats').doc(chatId).set({
      participants: [me.uid, other.uid],
      lastMessage: t || '📷 Photo', lastAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
    setPendingImgs([]);
    setSending(false);
    inputRef.current?.focus();
  };

  const pickChatImg = async (e) => {
    const files = Array.from(e.target.files).slice(0, 5);
    const compressed = await Promise.all(files.map(f => compressImg(f, 900, 0.75)));
    setPendingImgs(prev => [...prev, ...compressed].slice(0, 5));
    e.target.value = '';
  };

  const handleKey = e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); editingMsg ? saveEdit() : sendMsg(); }
  };

  const deleteMsg = async (msgId) => {
    setMsgMenu(null);
    await db.collection('chats').doc(chatId).collection('messages').doc(msgId).delete();
    showToast('🗑️ Message deleted');
  };

  const startEdit = (msg) => {
    setMsgMenu(null);
    setEditingMsg({ id: msg.id, text: msg.text });
    setText(msg.text);
    setTimeout(() => inputRef.current?.focus(), 100);
  };

  const saveEdit = async () => {
    const t = text.trim();
    if (!t || !editingMsg) return;
    await db.collection('chats').doc(chatId).collection('messages').doc(editingMsg.id).update({ text: t, edited: true });
    setText(''); setEditingMsg(null);
    showToast('✏️ Message edited');
  };

  const cancelEdit = () => { setEditingMsg(null); setText(''); };

  // Group messages by date
  const groupedMsgs = [];
  let lastDate = '';
  messages.forEach((msg, i) => {
    const d = msg.createdAt?.toDate ? msg.createdAt.toDate() : new Date();
    const dateStr = d.toLocaleDateString('en-BD', { day: 'numeric', month: 'long', year: 'numeric' });
    if (dateStr !== lastDate) {
      groupedMsgs.push({ type: 'date', label: dateStr });
      lastDate = dateStr;
    }
    const prev = messages[i - 1];
    const next = messages[i + 1];
    const isMine = msg.senderId === me.uid;
    const prevSame = prev && prev.senderId === msg.senderId;
    const nextSame = next && next.senderId === msg.senderId;
    groupedMsgs.push({ ...msg, isMine, isFirst: !prevSame, isLast: !nextSame });
  });

  const isEmojiOnly = txt => /^[\p{Emoji}\s]+$/u.test(txt) && txt.trim().length <= 6;

  return (
    <div className="chat-screen">
      {/* HEADER */}
      <div className="chat-header">
        <div className="chat-back" onClick={onBack}>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </div>
        <div className="chat-header-avatar-wrap">
          <div className="chat-header-avatar">
            {other.photoURL ? <img src={other.photoURL}/> : <span style={{color:'#fff',fontWeight:700,fontSize:16}}>{(other.name||'U')[0]}</span>}
          </div>
          <div className="chat-online-ring"/>
        </div>
        <div className="chat-header-info">
          <div className="chat-header-name">{other.name}</div>
          <div className="chat-header-status">● Online</div>
        </div>
        <div className="chat-header-actions">
          <div className="chat-action-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.8 10a19.79 19.79 0 01-3.07-8.67A2 2 0 012.7 0h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L6.91 7.09a16 16 0 006 6l1.06-1.06a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 14.07z"/></svg>
          </div>
          <div className="chat-action-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
          </div>
        </div>
      </div>

      {/* BODY */}
      <div className="chat-body" onClick={() => setShowEmoji(false)}>
        {messages.length === 0 && (
          <div style={{ textAlign: 'center', padding: '50px 20px', color: '#78909c' }}>
            <div style={{ fontSize: 56, marginBottom: 12 }}>👋</div>
            <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 6, color: '#546e7a' }}>Say hi to {other.name}!</div>
            <div style={{ fontSize: 12, color: '#90a4ae' }}>Messages are private between you two</div>
          </div>
        )}

        {groupedMsgs.map((item, idx) => {
          if (item.type === 'date') return (
            <div key={'d'+idx} className="date-sep">
              <div className="date-sep-pill">{item.label}</div>
            </div>
          );

          const emojiOnly = isEmojiOnly(item.text || '');

          return (
            <div key={item.id} className={`msg-row ${item.isMine ? 'mine' : ''}`} style={{ marginBottom: item.isLast ? 6 : 1 }}
              onContextMenu={e => { if (item.isMine) { e.preventDefault(); setMsgMenu(item); } }}
              onTouchStart={item.isMine ? (() => {
                const t = setTimeout(() => setMsgMenu(item), 600);
                const clear = () => clearTimeout(t);
                document.addEventListener('touchend', clear, { once: true });
                document.addEventListener('touchmove', clear, { once: true });
              }) : undefined}
            >
              {/* Other's avatar — only on last in group */}
              {!item.isMine && (
                <div className={`chat-bubble-avatar ${!item.isLast ? 'hidden' : ''}`}>
                  {other.photoURL ? <img src={other.photoURL}/> : (other.name||'U')[0]}
                </div>
              )}

              <div style={{ display: 'flex', flexDirection: 'column', alignItems: item.isMine ? 'flex-end' : 'flex-start', gap: 1 }}>
                {item.imageData ? (
                  <div className={`bubble-img ${item.isMine ? 'mine' : 'theirs'}`} style={{ border: item.isMine ? '2px solid rgba(124,77,255,0.3)' : '2px solid #e8eaf6' }}>
                    <img src={item.imageData} style={{ maxWidth:220, borderRadius:12, display:'block' }} />
                    <div style={{ fontSize:10, color: item.isMine ? 'rgba(255,255,255,0.7)' : '#78909c', textAlign:'right', padding:'2px 6px 4px' }}>{fmtTime(item.createdAt)}</div>
                  </div>
                ) : (
                <div className={`msg-bubble ${item.isMine ? 'mine' : 'theirs'} ${!item.isFirst ? 'no-tail' : ''} ${emojiOnly ? 'emoji-only' : ''}`}>
                  {item.text}
                  {item.edited && !emojiOnly && <span style={{ fontSize: 9, opacity: 0.6, marginLeft: 4 }}>edited</span>}
                  {!emojiOnly && (
                    <div className={`msg-meta ${item.isMine ? 'mine' : 'theirs'}`}>
                      <span className="msg-meta-time">{fmtTime(item.createdAt)}</span>
                      {item.isMine && (
                        <span className="msg-tick">
                          <svg viewBox="0 0 18 18" fill="none">
                            <path d="M3 9l4 4L15 5" stroke="rgba(255,255,255,0.8)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                            <path d="M6 9l4 4" stroke="rgba(255,255,255,0.8)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                          </svg>
                        </span>
                      )}
                    </div>
                  )}
                </div>
                )}
                {emojiOnly && !item.imageData && (
                  <div style={{ fontSize: 10, color: '#78909c', marginTop: 1, paddingRight: item.isMine ? 2 : 0, paddingLeft: item.isMine ? 0 : 2 }}>
                    {fmtTime(item.createdAt)}
                  </div>
                )}
              </div>
            </div>
          );
        })}

        {/* Typing indicator */}
        {typing && (
          <div className="msg-row">
            <div className="chat-bubble-avatar">{(other.name||'U')[0]}</div>
            <div className="typing-indicator">
              <div className="typing-dot"/>
              <div className="typing-dot"/>
              <div className="typing-dot"/>
            </div>
          </div>
        )}

        <div ref={bottomRef}/>
      </div>

      {/* EMOJI PICKER */}
      {showEmoji && (
        <div className="emoji-picker" onClick={e => e.stopPropagation()}>
          {EMOJIS.map(em => (
            <div key={em} className="emoji-item" onClick={() => { setText(prev => prev + em); inputRef.current?.focus(); }}>
              {em}
            </div>
          ))}
        </div>
      )}

      {/* MSG MENU OVERLAY */}
      {msgMenu && (
        <div style={{ position: 'fixed', inset: 0, zIndex: 50, background: 'rgba(0,0,0,0.3)' }} onClick={() => setMsgMenu(null)}>
          <div style={{ position: 'absolute', bottom: 90, left: '50%', transform: 'translateX(-50%)', background: '#fff', borderRadius: 18, padding: '6px 0', minWidth: 200, boxShadow: '0 8px 32px rgba(0,0,0,0.2)' }} onClick={e => e.stopPropagation()}>
            <div style={{ padding: '4px 8px 8px', textAlign: 'center', fontSize: 12, color: '#9ca3af', borderBottom: '1px solid #f0f4ff' }}>
              {(msgMenu.text || '').slice(0, 30)}{(msgMenu.text || '').length > 30 ? '...' : ''}
            </div>
            <div onClick={() => startEdit(msgMenu)} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '13px 20px', cursor: 'pointer', fontSize: 14, fontWeight: 600, color: '#7C4DFF' }}>
              <span style={{ fontSize: 18 }}>✏️</span> Edit Message
            </div>
            <div style={{ height: 1, background: '#f0f4ff' }} />
            <div onClick={() => deleteMsg(msgMenu.id)} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '13px 20px', cursor: 'pointer', fontSize: 14, fontWeight: 600, color: '#e53935' }}>
              <span style={{ fontSize: 18 }}>🗑️</span> Delete Message
            </div>
            <div style={{ height: 1, background: '#f0f4ff' }} />
            <div onClick={() => setMsgMenu(null)} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '13px 20px', cursor: 'pointer', fontSize: 14, fontWeight: 600, color: '#9ca3af' }}>
              <span style={{ fontSize: 18 }}>✕</span> Cancel
            </div>
          </div>
        </div>
      )}

      <div className="chat-input-bar">
        {/* Edit indicator */}
        {editingMsg && (
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '6px 14px 4px', background: '#ede7ff', borderRadius: '12px 12px 0 0', marginBottom: 2 }}>
            <span style={{ fontSize: 12, color: '#7C4DFF', fontWeight: 600 }}>✏️ Editing message</span>
            <span onClick={cancelEdit} style={{ fontSize: 12, color: '#e53935', cursor: 'pointer', fontWeight: 700 }}>✕ Cancel</span>
          </div>
        )}
        {/* Pending image previews */}
        {pendingImgs.length > 0 && (
          <div className="img-preview-strip">
            {pendingImgs.map((src, i) => (
              <div key={i} className="img-preview-item">
                <img src={src} />
                <div className="img-preview-rm" onClick={() => setPendingImgs(p => p.filter((_,j) => j!==i))}>✕</div>
              </div>
            ))}
            {pendingImgs.length < 5 && (
              <label style={{ width:60, height:60, borderRadius:10, background:'rgba(124,77,255,0.1)', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', flexShrink:0, fontSize:20, border:'2px dashed #7C4DFF' }}>
                <input type="file" accept="image/*" multiple style={{ display:'none' }} onChange={pickChatImg} />+
              </label>
            )}
          </div>
        )}
        <div className="chat-input-row">
          <div className="chat-inp-wrap">
            <span className="chat-emoji-btn" onClick={e => { e.stopPropagation(); setShowEmoji(v => !v); }}>
              {showEmoji ? '😶' : '😊'}
            </span>
            <textarea
              ref={inputRef}
              className="chat-inp"
              placeholder="Write a message..."
              value={text}
              rows={1}
              onChange={e => {
                setText(e.target.value);
                e.target.style.height = 'auto';
                e.target.style.height = Math.min(e.target.scrollHeight, 100) + 'px';
              }}
              onKeyDown={handleKey}
            />
            <span className="chat-attach-btn">
              <label style={{ cursor:'pointer', fontSize:19 }}>
                <input ref={imgInputRef} type="file" accept="image/*" multiple style={{ display:'none' }} onChange={pickChatImg} />
                📎
              </label>
            </span>
            <span className="chat-attach-btn">
              <label style={{ cursor:'pointer', fontSize:19 }}>
                <input type="file" accept="image/*" capture="environment" style={{ display:'none' }} onChange={pickChatImg} />
                📷
              </label>
            </span>
          </div>

          {(text.trim() || pendingImgs.length > 0) ? (
            <button className="chat-send-btn" onClick={editingMsg ? saveEdit : sendMsg}>
              {editingMsg
                ? <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                : <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"/>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                  </svg>
              }
            </button>
          ) : (
            <div className="chat-mic-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
                <path d="M19 10v2a7 7 0 01-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>
              </svg>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ===== SETTINGS PAGE =====
function SettingsPage({ me, onBack, showToast, lang, setLang }) {
  const { t } = useLang();
  const [section, setSection] = useState('main');
  const [notifToggles, setNotifToggles] = useState(() => {
    try { return JSON.parse(localStorage.getItem('tc_notif') || '{"msg":true,"friend":true,"post":false}'); } catch { return { msg:true, friend:true, post:false }; }
  });
  const [fontSize, setFontSize] = useState(localStorage.getItem('tc_fontsize') || 'medium');
  const [privacySettings, setPrivacySettings] = useState(() => {
    try { return JSON.parse(localStorage.getItem('tc_privacy') || '{"profileVisible":"everyone","onlineStatus":true,"readReceipts":true,"allowMessages":"everyone","showPhone":false,"showEmail":false}'); }
    catch { return { profileVisible:'everyone', onlineStatus:true, readReceipts:true, allowMessages:'everyone', showPhone:false, showEmail:false }; }
  });
  const [reportText, setReportText] = useState('');
  const [reportSending, setReportSending] = useState(false);
  const [changePwForm, setChangePwForm] = useState({ current:'', next:'', confirm:'' });
  const [pwChanging, setPwChanging] = useState(false);
  const [deleteConfirm, setDeleteConfirm] = useState('');

  const savePrivacy = (key, val) => {
    const updated = { ...privacySettings, [key]: val };
    setPrivacySettings(updated);
    localStorage.setItem('tc_privacy', JSON.stringify(updated));
    db.collection('users').doc(me.uid).update({ privacy: updated }).catch(() => {});
  };

  const saveNotif = (key, val) => {
    const updated = { ...notifToggles, [key]: val };
    setNotifToggles(updated);
    localStorage.setItem('tc_notif', JSON.stringify(updated));
  };

  const applyFontSize = (size) => {
    setFontSize(size);
    localStorage.setItem('tc_fontsize', size);
    const map = { small: '13px', medium: '15px', large: '17px' };
    document.documentElement.style.setProperty('--base-font', map[size]);
  };

  const sendReport = async () => {
    if (!reportText.trim()) { showToast('❌ Please describe the issue'); return; }
    setReportSending(true);
    await db.collection('reports').add({ uid: me.uid, name: me.name, text: reportText.trim(), createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    setReportText('');
    setReportSending(false);
    showToast('✅ Report sent. Thank you!');
  };

  const changePassword = async () => {
    if (!changePwForm.current) { showToast('❌ Enter current password'); return; }
    if (changePwForm.next.length < 6) { showToast('❌ New password must be 6+ chars'); return; }
    if (changePwForm.next !== changePwForm.confirm) { showToast('❌ Passwords do not match'); return; }
    setPwChanging(true);
    try {
      const cred = firebase.auth.EmailAuthProvider.credential(me.email || auth.currentUser.email, changePwForm.current);
      await auth.currentUser.reauthenticateWithCredential(cred);
      await auth.currentUser.updatePassword(changePwForm.next);
      setChangePwForm({ current:'', next:'', confirm:'' });
      showToast('✅ Password changed!');
      setSection('account');
    } catch(e) {
      showToast('❌ ' + (e.message || 'Failed'));
    }
    setPwChanging(false);
  };

  const deleteAccount = async () => {
    if (deleteConfirm !== 'DELETE') { showToast('❌ Type DELETE to confirm'); return; }
    try {
      await db.collection('users').doc(me.uid).delete();
      await auth.currentUser.delete();
      showToast('Account deleted');
    } catch(e) { showToast('❌ ' + (e.message || 'Failed. Please re-login first.')); }
  };

  // ── shared sub-components ──
  const SectionHeader = ({ title, back }) => (
    <div style={{ display:'flex', alignItems:'center', gap:12, padding:'14px 16px 10px', background:'#fff', borderBottom:'1px solid #f0f4ff', position:'sticky', top:0, zIndex:10 }}>
      <div onClick={() => back ? back() : (section === 'main' ? onBack() : setSection('main'))} style={{ width:36, height:36, borderRadius:12, background:'#f0f4ff', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', fontSize:18 }}>←</div>
      <span style={{ fontWeight:800, fontSize:16, color:'#1a1a2e' }}>{title}</span>
    </div>
  );

  const MenuItem = ({ icon, label, sub, onClick, right, danger }) => (
    <div onClick={onClick} style={{ display:'flex', alignItems:'center', gap:14, padding:'15px 18px', background:'#fff', borderBottom:'1px solid #f8f9ff', cursor:'pointer' }}
      onTouchStart={e => e.currentTarget.style.background='#f8f9ff'} onTouchEnd={e => e.currentTarget.style.background='#fff'}>
      <div style={{ width:40, height:40, borderRadius:12, background: danger ? '#fff0f0' : '#f0f4ff', display:'flex', alignItems:'center', justifyContent:'center', fontSize:20, flexShrink:0 }}>{icon}</div>
      <div style={{ flex:1 }}>
        <div style={{ fontSize:14, fontWeight:600, color: danger ? '#e53935' : '#1a1a2e' }}>{label}</div>
        {sub && <div style={{ fontSize:12, color:'#9ca3af', marginTop:2 }}>{sub}</div>}
      </div>
      {right !== undefined ? right : <span style={{ color:'#c4c8d8', fontSize:18 }}>›</span>}
    </div>
  );

  const Toggle = ({ value, onChange }) => (
    <div onClick={() => onChange(!value)} style={{ width:44, height:24, borderRadius:12, background: value ? '#7C4DFF' : '#d1d5db', position:'relative', cursor:'pointer', transition:'background .2s', flexShrink:0 }}>
      <div style={{ position:'absolute', top:3, left: value ? 23 : 3, width:18, height:18, borderRadius:'50%', background:'#fff', transition:'left .2s', boxShadow:'0 1px 4px rgba(0,0,0,0.2)' }} />
    </div>
  );

  const RadioGroup = ({ options, value, onChange }) => (
    <div style={{ display:'flex', flexDirection:'column', gap:0 }}>
      {options.map(([val, label]) => (
        <div key={val} onClick={() => onChange(val)} style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'13px 18px', borderBottom:'1px solid #f8f9ff', cursor:'pointer', background:'#fff' }}>
          <span style={{ fontSize:14, fontWeight:500, color:'#1a1a2e' }}>{label}</span>
          <div style={{ width:20, height:20, borderRadius:'50%', border: value===val ? 'none' : '2px solid #d1d5db', background: value===val ? 'linear-gradient(135deg,#7C4DFF,#ff6b9d)' : 'transparent', display:'flex', alignItems:'center', justifyContent:'center' }}>
            {value===val && <div style={{ width:8, height:8, borderRadius:'50%', background:'#fff' }} />}
          </div>
        </div>
      ))}
    </div>
  );

  const PwInput = ({ label, field }) => (
    <div style={{ marginBottom:12 }}>
      <div style={{ fontSize:12, fontWeight:600, color:'#6b7280', marginBottom:5 }}>{label}</div>
      <input className="inp" type="password" value={changePwForm[field]} onChange={e => setChangePwForm(p => ({ ...p, [field]: e.target.value }))} autoComplete="off" autoCorrect="off" />
    </div>
  );

  // ── LANGUAGE ──
  if (section === 'language') return (
    <div style={{ minHeight:'100vh', background:'#f8f9ff', paddingBottom:40 }}>
      <SectionHeader title={t.langTitle} />
      <div style={{ padding:'8px 0' }}>

// ===== NOTIFICATION PAGE =====
function NotifPage({ me, showToast, onViewProfile, onChatOpen }) {
  const [notifs, setNotifs] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (!me?.uid) return;
    // Listen to user doc for friendRequests + notifications sub-collection
    const unsubUser = db.collection('users').doc(me.uid).onSnapshot(snap => {
      if (!snap.exists) return;
      const d = snap.data();
      const reqs = (d.friendRequests || []);
      // Build notif items from friendRequests
      Promise.all(reqs.map(uid =>
        db.collection('users').doc(uid).get().then(s => s.exists ? ({ type: 'friend_req', uid, name: s.data().name, photo: s.data().photoURL, userData: s.data() }) : null)
      )).then(items => {
        const reqNotifs = items.filter(Boolean).map(i => ({ ...i, id: 'req_' + i.uid, time: null }));
        setNotifs(reqNotifs);
        setLoading(false);
      });
    });
    return () => unsubUser();
  }, [me?.uid]);

  const accept = async (item) => {
    const batch = db.batch();
    batch.update(db.collection('users').doc(me.uid), {
      friends: firebase.firestore.FieldValue.arrayUnion(item.uid),
      friendRequests: firebase.firestore.FieldValue.arrayRemove(item.uid),
    });
    batch.update(db.collection('users').doc(item.uid), {
      friends: firebase.firestore.FieldValue.arrayUnion(me.uid),
      sentRequests: firebase.firestore.FieldValue.arrayRemove(me.uid),
    });
    await batch.commit();
    showToast('✅ Friend request accepted!');
  };

  const decline = async (item) => {
    await db.collection('users').doc(me.uid).update({
      friendRequests: firebase.firestore.FieldValue.arrayRemove(item.uid),
    });
    await db.collection('users').doc(item.uid).update({
      sentRequests: firebase.firestore.FieldValue.arrayRemove(me.uid),
    });
    showToast('❌ Request declined');
  };

  return (
    <div style={{ minHeight: '100vh', background: '#f8f9ff', paddingBottom: 80 }}>
      {/* Header */}
      <div style={{ background: '#fff', padding: '14px 16px', display: 'flex', alignItems: 'center', gap: 12, borderBottom: '1px solid #e8eaf6', position: 'sticky', top: 0, zIndex: 10 }}>
        <span style={{ fontSize: 17, fontWeight: 800, background: 'linear-gradient(135deg,#7C4DFF,#ff6b9d)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>🔔 Notifications</span>
        {notifs.length > 0 && (
          <div style={{ marginLeft: 'auto', background: '#7C4DFF', color: '#fff', borderRadius: 20, padding: '2px 10px', fontSize: 11, fontWeight: 700 }}>{notifs.length} new</div>
        )}
      </div>

      {loading ? (
        <div style={{ textAlign: 'center', padding: 60, color: '#9ca3af', fontSize: 14 }}>Loading...</div>
      ) : notifs.length === 0 ? (
        <div style={{ textAlign: 'center', padding: '80px 24px' }}>
          <div style={{ fontSize: 56, marginBottom: 14 }}>🔔</div>
          <div style={{ fontWeight: 700, fontSize: 16, color: '#374151', marginBottom: 8 }}>No notifications yet</div>
          <div style={{ fontSize: 13, color: '#9ca3af' }}>Friend requests and activity will show up here</div>
        </div>
      ) : (
        <div>
          {/* Friend Requests Section */}
          {notifs.some(n => n.type === 'friend_req') && (
            <div>
              <div style={{ padding: '14px 16px 8px', fontSize: 12, fontWeight: 700, color: '#7C4DFF', background: '#f8f9ff', letterSpacing: 0.5, textTransform: 'uppercase' }}>
                👥 Friend Requests
              </div>
              {notifs.filter(n => n.type === 'friend_req').map(item => (
                <div key={item.id} className="notif-item unread">
                  <div className="notif-icon-wrap" onClick={() => onViewProfile && onViewProfile(item.userData)} style={{ cursor: 'pointer' }}>
                    {item.photo
                      ? <img src={item.photo} style={{ width: '100%', height: '100%', objectFit: 'cover', borderRadius: '50%' }} />
                      : <span style={{ color: '#fff', fontWeight: 700, fontSize: 18 }}>{(item.name || '?')[0]}</span>
                    }
                  </div>
                  <div className="notif-text">
                    <strong>{item.name}</strong> sent you a friend request
                    <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
                      <button onClick={() => accept(item)} style={{ flex: 1, background: 'linear-gradient(135deg,#7C4DFF,#9c6fff)', color: '#fff', border: 'none', borderRadius: 10, padding: '8px 0', fontFamily: 'Poppins', fontWeight: 700, fontSize: 12, cursor: 'pointer' }}>
                        ✅ Accept
                      </button>
                      <button onClick={() => decline(item)} style={{ flex: 1, background: '#f0f4ff', color: '#6b7280', border: '1.5px solid #e8eaf6', borderRadius: 10, padding: '8px 0', fontFamily: 'Poppins', fontWeight: 700, fontSize: 12, cursor: 'pointer' }}>
                        ✕ Decline
                      </button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ===== FRIENDS PAGE =====
function FriendsPage({ me, showToast, onChatOpen }) {
  const [activeTab, setActiveTab] = useState('friends');
  const [friends, setFriends] = useState([]);
  const [requests, setRequests] = useState([]);

  useEffect(() => {
    if (!me) return;
    const fids = me.friends || [];
    const rids = me.friendRequests || [];
    if (fids.length) Promise.all(fids.map(uid => db.collection('users').doc(uid).get())).then(snaps => setFriends(snaps.map(s => s.data()).filter(Boolean)));
    else setFriends([]);
    if (rids.length) Promise.all(rids.map(uid => db.collection('users').doc(uid).get())).then(snaps => setRequests(snaps.map(s => s.data()).filter(Boolean)));
    else setRequests([]);
  }, [me]);

  const acceptRequest = async (user) => {
    const batch = db.batch();
    batch.update(db.collection('users').doc(me.uid), {
      friends: firebase.firestore.FieldValue.arrayUnion(user.uid),
      friendRequests: firebase.firestore.FieldValue.arrayRemove(user.uid)
    });
    batch.update(db.collection('users').doc(user.uid), {
      friends: firebase.firestore.FieldValue.arrayUnion(me.uid),
      sentRequests: firebase.firestore.FieldValue.arrayRemove(me.uid)
    });
    await batch.commit();
    showToast(`✅ Now friends with ${user.name}!`);
  };

  const declineRequest = async (user) => {
    const batch = db.batch();
    batch.update(db.collection('users').doc(me.uid), { friendRequests: firebase.firestore.FieldValue.arrayRemove(user.uid) });
    batch.update(db.collection('users').doc(user.uid), { sentRequests: firebase.firestore.FieldValue.arrayRemove(me.uid) });
    await batch.commit();
    showToast('Request declined');
  };

  return (
    <div>
      <div className="topbar"><span className="topbar-logo">Friends</span></div>
      <div className="friends-tabs">
        <div className={`friends-tab ${activeTab === 'friends' ? 'active' : ''}`} onClick={() => setActiveTab('friends')}>Friends ({friends.length})</div>
        <div className={`friends-tab ${activeTab === 'requests' ? 'active' : ''}`} onClick={() => setActiveTab('requests')}>
          Requests {requests.length > 0 && <span style={{ background: '#7C4DFF', color: '#fff', borderRadius: 10, padding: '1px 7px', fontSize: 11, marginLeft: 4 }}>{requests.length}</span>}
        </div>
      </div>
      <div className="page-content">
        {activeTab === 'friends' && (
          friends.length === 0 ? <div className="empty-state"><div className="emoji">👥</div><p>No friends yet. Search and add people!</p></div>
            : friends.map(f => (
              <div key={f.uid} className="friend-item">
                <Avatar user={f} size={48} />
                <div className="friend-info">
                  <div className="friend-name">{f.name}</div>
                  <div className="friend-sub">{(f.friends || []).length} mutual friends</div>
                </div>
                <button className="btn-chat-small" onClick={() => onChatOpen(f)}>💬 Chat</button>
              </div>
            ))
        )}
        {activeTab === 'requests' && (
          requests.length === 0 ? <div className="empty-state"><div className="emoji">📬</div><p>No pending friend requests</p></div>
            : requests.map(user => (
              <div key={user.uid} className="friend-item">
                <Avatar user={user} size={48} />
                <div className="friend-info">
                  <div className="friend-name">{user.name}</div>
                  <div className="friend-sub">Wants to be your friend</div>
                </div>
                <div>
                  <button className="btn-accept" onClick={() => acceptRequest(user)}>✓ Accept</button>
                  <button className="btn-decline" onClick={() => declineRequest(user)}>✕</button>
                </div>
              </div>
            ))
        )}
      </div>
    </div>
  );
}

// ===== FIELD COMPONENTS — outside EditProfilePage to prevent remount on re-render =====
function ProfileField({ label, placeholder, value, onChange, inputMode, rows }) {
  return (
    <div style={{ marginBottom: 14 }}>
      <label style={{ fontSize: 12, fontWeight: 600, color: '#6b7280', display: 'block', marginBottom: 6 }}>{label}</label>
      {rows ? (
        <textarea
          className="inp"
          rows={rows}
          placeholder={placeholder}
          value={value}
          onChange={e => onChange(e.target.value)}
          style={{ resize: 'none' }}
        />
      ) : (
        <input
          className="inp"
          type="text"
          inputMode={inputMode || 'text'}
          placeholder={placeholder}
          value={value}
          onChange={e => onChange(e.target.value)}
          autoComplete="off"
          autoCorrect="off"
          autoCapitalize="off"
          spellCheck="false"
        />
      )}
    </div>
  );
}

function ProfilePrivacySelect({ label, value, onChange }) {
  return (
    <div style={{ marginBottom: 14 }}>
      <label style={{ fontSize: 12, fontWeight: 600, color: '#6b7280', display: 'block', marginBottom: 6 }}>{label}</label>
      <div style={{ display: 'flex', gap: 8 }}>
        {[['public', '🌍 Public'], ['friends', '👥 Friends'], ['only_me', '🔒 Only Me']].map(([val, lbl]) => (
          <div key={val} onClick={() => onChange(val)} style={{
            flex: 1, textAlign: 'center', padding: '9px 6px', borderRadius: 12, fontSize: 12, fontWeight: 600, cursor: 'pointer',
            background: value === val ? 'linear-gradient(135deg,#7C4DFF,#9c6fff)' : '#f0f4ff',
            color: value === val ? '#fff' : '#6b7280',
            border: value === val ? '2px solid #7C4DFF' : '2px solid #e8eaf6',
            transition: 'all .2s'
          }}>{lbl}</div>
        ))}
      </div>
    </div>
  );
}

// ===== EDIT PROFILE FULL PAGE =====
function EditProfilePage({ me, onBack, showToast }) {
  const [activeSection, setActiveSection] = useState('basic');
  const [saving, setSaving] = useState(false);
  const [imgLoading, setImgLoading] = useState({ avatar: false, cover: false });

  // Form state
  const [form, setForm] = useState({
    name: me?.name || '',
    username: me?.username || '',
    bio: me?.bio || '',
    relationship: me?.relationship || '',
    job: me?.job || '',
    education: me?.education || '',
    dob: me?.dob || '',
    phone: me?.phone || '',
    email: me?.email || '',
    city: me?.city || '',
    hometown: me?.hometown || '',
    company: me?.company || '',
    school: me?.school || '',
    university: me?.university || '',
    hobbies: me?.hobbies || '',
    favMusic: me?.favMusic || '',
    favMovie: me?.favMovie || '',
    favBook: me?.favBook || '',
    whatsapp: me?.whatsapp || '',
    instagram: me?.instagram || '',
    privacyPosts: me?.privacyPosts || 'friends',
    privacyFriends: me?.privacyFriends || 'public',
    photoURL: me?.photoURL || '',
    coverURL: me?.coverURL || '',
  });

  const set = (key, val) => setForm(prev => ({ ...prev, [key]: val }));

  // Shorthand aliases pointing to outside components
  const Field = ProfileField;
  const PrivacySelect = ProfilePrivacySelect;
  const handleImgUpload = (type, e) => {
    const file = e.target.files[0];
    if (!file) return;
    setImgLoading(prev => ({ ...prev, [type]: true }));
    const reader = new FileReader();
    reader.onload = ev => {
      // compress
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const maxW = type === 'cover' ? 800 : 300;
        const ratio = Math.min(maxW / img.width, 1);
        canvas.width = img.width * ratio;
        canvas.height = img.height * ratio;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        const b64 = canvas.toDataURL('image/jpeg', 0.7);
        set(type === 'cover' ? 'coverURL' : 'photoURL', b64);
        setImgLoading(prev => ({ ...prev, [type]: false }));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };

  const save = async () => {
    if (!form.name.trim()) { showToast('❌ Name cannot be empty'); return; }
    setSaving(true);
    try {
      await db.collection('users').doc(me.uid).update({
        name: form.name.trim(),
        username: form.username.trim(),
        bio: form.bio.trim(),
        relationship: form.relationship,
        job: form.job.trim(),
        education: form.education.trim(),
        dob: form.dob,
        phone: form.phone.trim(),
        email: form.email.trim(),
        city: form.city.trim(),
        hometown: form.hometown.trim(),
        company: form.company.trim(),
        school: form.school.trim(),
        university: form.university.trim(),
        hobbies: form.hobbies.trim(),
        favMusic: form.favMusic.trim(),
        favMovie: form.favMovie.trim(),
        favBook: form.favBook.trim(),
        whatsapp: form.whatsapp.trim(),
        instagram: form.instagram.trim(),
        privacyPosts: form.privacyPosts,
        privacyFriends: form.privacyFriends,
        photoURL: form.photoURL,
        coverURL: form.coverURL,
      });
      showToast('✅ Profile saved successfully!');
      onBack();
    } catch(e) { showToast('❌ Save failed: ' + e.message); }
    setSaving(false);
  };

  const sections = [
    { id: 'basic', label: 'Basic Info', emoji: '👤' },
    { id: 'personal', label: 'Personal', emoji: '📋' },
    { id: 'work', label: 'Work & Edu', emoji: '🎓' },
    { id: 'interests', label: 'Interests', emoji: '🎵' },
    { id: 'contact', label: 'Contact', emoji: '📞' },
    { id: 'privacy', label: 'Privacy', emoji: '🔒' },
  ];

  return (
    <div style={{ minHeight: '100vh', background: '#f8f9ff' }}>
      {/* Header */}
      <div style={{ background: '#fff', padding: '14px 16px', display: 'flex', alignItems: 'center', gap: 12, borderBottom: '1px solid #e8eaf6', position: 'sticky', top: 0, zIndex: 100 }}>
        <div onClick={onBack} style={{ cursor: 'pointer', width: 36, height: 36, borderRadius: 10, background: '#f0f4ff', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <Icon name="back" size={20} color="#6b7280" />
        </div>
        <span style={{ flex: 1, fontSize: 17, fontWeight: 800, background: 'linear-gradient(135deg,#7C4DFF,#ff6b9d)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>Edit Profile</span>
        <button onClick={save} disabled={saving} style={{ background: 'linear-gradient(135deg,#7C4DFF,#9c6fff)', color: '#fff', border: 'none', borderRadius: 12, padding: '9px 20px', fontFamily: 'Poppins', fontSize: 13, fontWeight: 700, cursor: 'pointer', opacity: saving ? 0.7 : 1 }}>
          {saving ? 'Saving...' : '💾 Save'}
        </button>
      </div>

      {/* Cover & Avatar */}
      <div style={{ position: 'relative', marginBottom: 50 }}>
        {/* Cover Photo */}
        <label style={{ cursor: 'pointer', display: 'block' }}>
          <input type="file" accept="image/*" style={{ display: 'none' }} onChange={e => handleImgUpload('cover', e)} />
          <div style={{ width: '100%', height: 160, background: form.coverURL ? 'none' : 'linear-gradient(135deg,#ede7ff,#fce4ec)', position: 'relative', overflow: 'hidden' }}>
            {form.coverURL
              ? <img src={form.coverURL} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
              : <div style={{ width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: 6 }}>
                  <span style={{ fontSize: 32 }}>🖼️</span>
                  <span style={{ fontSize: 12, color: '#9ca3af', fontWeight: 600 }}>Tap to add cover photo</span>
                </div>
            }
            <div style={{ position: 'absolute', bottom: 10, right: 10, background: 'rgba(0,0,0,0.5)', borderRadius: 10, padding: '6px 12px', color: '#fff', fontSize: 12, fontWeight: 600, display: 'flex', alignItems: 'center', gap: 5 }}>
              📷 {imgLoading.cover ? 'Loading...' : 'Change Cover'}
            </div>
          </div>
        </label>

        {/* Profile Avatar */}
        <label style={{ cursor: 'pointer', position: 'absolute', bottom: -42, left: '50%', transform: 'translateX(-50%)', display: 'block' }}>
          <input type="file" accept="image/*" style={{ display: 'none' }} onChange={e => handleImgUpload('avatar', e)} />
          <div style={{ width: 84, height: 84, borderRadius: '50%', border: '4px solid #fff', overflow: 'hidden', background: 'linear-gradient(135deg,#7C4DFF,#ff6b9d)', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 4px 20px rgba(124,77,255,0.3)', position: 'relative' }}>
            {form.photoURL
              ? <img src={form.photoURL} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
              : <span style={{ fontSize: 32, color: '#fff', fontWeight: 700 }}>{(form.name || me?.name || 'U')[0]}</span>
            }
            <div style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.35)', display: 'flex', alignItems: 'center', justifyContent: 'center', borderRadius: '50%' }}>
              <span style={{ fontSize: 20 }}>📷</span>
            </div>
          </div>
        </label>
      </div>

      {/* Section Tabs - horizontal scroll */}
      <div style={{ overflowX: 'auto', display: 'flex', gap: 8, padding: '8px 16px 12px', scrollbarWidth: 'none', background: '#fff', borderBottom: '1px solid #e8eaf6' }}>
        {sections.map(s => (
          <div key={s.id} onClick={() => setActiveSection(s.id)} style={{
            display: 'flex', alignItems: 'center', gap: 5, padding: '8px 14px', borderRadius: 20, fontSize: 12, fontWeight: 600, whiteSpace: 'nowrap', cursor: 'pointer', transition: 'all .2s',
            background: activeSection === s.id ? 'linear-gradient(135deg,#7C4DFF,#9c6fff)' : '#f0f4ff',
            color: activeSection === s.id ? '#fff' : '#6b7280',
          }}>
            <span>{s.emoji}</span><span>{s.label}</span>
          </div>
        ))}
      </div>

      {/* Section Content */}
      <div style={{ padding: '20px 16px 100px' }}>

        {/* 1. BASIC INFO */}
        {activeSection === 'basic' && (
          <div>
            <div style={{ fontSize: 13, fontWeight: 700, color: '#1a1a2e', marginBottom: 16, display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ width: 32, height: 32, background: 'linear-gradient(135deg,#7C4DFF,#9c6fff)', borderRadius: 10, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16 }}>👤</span>
              Basic Information
            </div>
            <Field label="Full Name *" placeholder="Your full name" value={form.name} onChange={v => set('name', v)} />
            <Field label="Username" placeholder="@yourusername" value={form.username} onChange={v => set('username', v)} />
            <Field label="Bio / Intro" placeholder="Tell something about you..." value={form.bio} onChange={v => set('bio', v)} rows={3} />
            <div style={{ marginBottom: 14 }}>

                {['Single', 'In a relationship', 'Married', 'It\'s complicated'].map(r => (
                  <div key={r} onClick={() => set('relationship', r)} style={{
                    padding: '8px 14px', borderRadius: 20, fontSize: 12, fontWeight: 600, cursor: 'pointer', transition: 'all .2s',
                    background: form.relationship === r ? 'linear-gradient(135deg,#ff6b9d,#ff9abe)' : '#f0f4ff',
                    color: form.relationship === r ? '#fff' : '#6b7280',

        {/* 2. PERSONAL INFO */}
        {activeSection === 'personal' && (
          <div>
            <div style={{ fontSize: 13, fontWeight: 700, color: '#1a1a2e', marginBottom: 16, display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ width: 32, height: 32, background: 'linear-gradient(135deg,#4fc3f7,#0288d1)', borderRadius: 10, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16 }}>📋</span>
              Personal Information

            <div style={{ marginBottom: 14 }}>
              <label style={{ fontSize: 12, fontWeight: 600, color: '#6b7280', display: 'block', marginBottom: 6 }}>Date of Birth</label>

            <Field label="Mobile Number" placeholder="+880 1xxx xxxxxx" value={form.phone} onChange={v => set('phone', v)} inputMode="tel" />
            <Field label="Email Address" placeholder="your@email.com" value={form.email} onChange={v => set('email', v)} inputMode="email" />
            <Field label="Current City" placeholder="Where do you live now?" value={form.city} onChange={v => set('city', v)} />

        {/* 4. INTERESTS & HOBBIES */}
        {activeSection === 'interests' && (
          <div>
            <div style={{ fontSize: 13, fontWeight: 700, color: '#1a1a2e', marginBottom: 16, display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ width: 32, height: 32, background: 'linear-gradient(135deg,#ff6b9d,#c2185b)', borderRadius: 10, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16 }}>🎵</span>

            <Field label="🎵 Favorite Music" placeholder="e.g. BTS, Arijit Singh, Pop..." value={form.favMusic} onChange={v => set('favMusic', v)} />
            <Field label="🎬 Favorite Movies" placeholder="e.g. Avengers, Titanic..." value={form.favMovie} onChange={v => set('favMovie', v)} />

            {/* Featured / Highlight section */}
            <div style={{ background: 'linear-gradient(135deg,#ede7ff,#fce4ec)', borderRadius: 16, padding: 16, marginTop: 8 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: '#7C4DFF', marginBottom: 8 }}>⭐ Featured Highlights</div>
              <div style={{ fontSize: 12, color: '#6b7280', lineHeight: 1.6 }}>
                You can highlight your important posts by pinning them. Go to any post → tap ··· → "Pin to Profile" to feature it here.

        )}

        {/* 5. CONTACT / SOCIAL LINKS */}

          <div>

              <span style={{ width: 32, height: 32, background: 'linear-gradient(135deg,#25D366,#128C7E)', borderRadius: 10, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16 }}>📞</span>

            </div>
            <div style={{ marginBottom: 14 }}>
              <label style={{ fontSize: 12, fontWeight: 600, color: '#6b7280', display: 'block', marginBottom: 6 }}>💬 WhatsApp Number</label>

              </div>
            </div>
            <div style={{ marginBottom: 14 }}>
              <label style={{ fontSize: 12, fontWeight: 600, color: '#6b7280', display: 'block', marginBottom: 6 }}>📸 Instagram Username</label>

                <span style={{ position: 'absolute', left: 14, top: '50%', transform: 'translateY(-50%)', fontSize: 16 }}>📸</span>
