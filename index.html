              </div>
            </div>
            <div style={{ background: '#f0f4ff', borderRadius: 14, padding: 14, marginTop: 4 }}>
              <div style={{ fontSize: 12, color: '#9ca3af', lineHeight: 1.6 }}>
                🔒 Your contact info is only visible to your friends based on your privacy settings.
              </div>
            </div>
          </div>
        )}

        {/* 6. PRIVACY SETTINGS */}
        {activeSection === 'privacy' && (
          <div>
            <div style={{ fontSize: 13, fontWeight: 700, color: '#1a1a2e', marginBottom: 16, display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ width: 32, height: 32, background: 'linear-gradient(135deg,#7C4DFF,#5e35b1)', borderRadius: 10, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16 }}>🔒</span>
              Privacy Settings
            </div>
            <PrivacySelect label="Who can see my Posts?" value={form.privacyPosts} onChange={v => set('privacyPosts', v)} />
            <PrivacySelect label="Who can see my Friends list?" value={form.privacyFriends} onChange={v => set('privacyFriends', v)} />
            <div style={{ background: 'linear-gradient(135deg,#ede7ff,#fce4ec)', borderRadius: 16, padding: 16, marginTop: 8 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: '#7C4DFF', marginBottom: 8 }}>ℹ️ Privacy Tips</div>
              <div style={{ fontSize: 12, color: '#6b7280', lineHeight: 1.8 }}>
                🌍 <strong>Public</strong> — Everyone can see<br/>
                👥 <strong>Friends</strong> — Only your friends can see<br/>
                🔒 <strong>Only Me</strong> — Only you can see
              </div>
            </div>
          </div>
        )}

        {/* Save Button */}
        <button onClick={save} disabled={saving} style={{
          width: '100%', background: 'linear-gradient(135deg,#7C4DFF,#ff6b9d)', color: '#fff', border: 'none',
          borderRadius: 16, padding: '15px', fontFamily: 'Poppins', fontSize: 15, fontWeight: 700, cursor: 'pointer',
          marginTop: 20, boxShadow: '0 6px 20px rgba(124,77,255,0.35)', opacity: saving ? 0.7 : 1
        }}>
          {saving ? '⏳ Saving...' : '💾 Save All Changes'}
        </button>
      </div>
    </div>
  );
}

// ===== PROFILE PAGE =====
function ProfilePage({ me, showToast }) {
  const [showEdit, setShowEdit] = useState(false);
  const [posts, setPosts] = useState([]);
  const [postTab, setPostTab] = useState('all');
  const [loadingPosts, setLoadingPosts] = useState(true);

  useEffect(() => {
    if (!me?.uid) return;
    setLoadingPosts(true);
    // No orderBy to avoid composite index requirement — sort client-side
    const unsub = db.collection('posts')
      .where('authorId', '==', me.uid)
      .onSnapshot(snap => {
        const ps = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => {
            const at = a.createdAt?.seconds || 0;
            const bt = b.createdAt?.seconds || 0;
            return bt - at;
          });
        setPosts(ps);
        setLoadingPosts(false);
      }, err => {
        console.error('Posts error:', err);
        setLoadingPosts(false);
      });
    return unsub;
  }, [me?.uid]);

  if (showEdit) return <EditProfilePage me={me} onBack={() => setShowEdit(false)} showToast={showToast} />;

  const getThumb = (p) => (p.images?.length ? p.images[0] : p.imageURL || '');
  const imgPosts = posts.filter(p => getThumb(p));

  return (
    <div>
      <div className="topbar">
        <span className="topbar-logo">Profile</span>
        <div className="icon-btn" onClick={() => auth.signOut()}>
          <Icon name="logout" size={18} color="#9ca3af" />
        </div>
      </div>
      <div className="page-content">
        {/* Cover Photo */}
        <div style={{ width: '100%', height: 160, background: me?.coverURL ? 'none' : 'linear-gradient(135deg,#ede7ff,#fce4ec)', overflow: 'hidden', position: 'relative' }}>
          {me?.coverURL
            ? <img src={me.coverURL} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
            : <div style={{ width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 48 }}>🌸</div>
          }
        </div>

        {/* Avatar */}
        <div style={{ textAlign: 'center' }}>
          <div style={{ margin: '-42px auto 0', width: 84, position: 'relative', display: 'inline-block' }}>
            <div style={{ width: 84, height: 84, borderRadius: '50%', border: '4px solid #fff', overflow: 'hidden', background: 'linear-gradient(135deg,#7C4DFF,#ff6b9d)', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 4px 20px rgba(124,77,255,0.3)' }}>
              {me?.photoURL ? <img src={me.photoURL} style={{ width: '100%', height: '100%', objectFit: 'cover' }} /> : <span style={{ fontSize: 32, color: '#fff', fontWeight: 700 }}>{(me?.name || 'U')[0]}</span>}
            </div>
          </div>
        </div>

        {/* Info */}
        <div style={{ textAlign: 'center', padding: '10px 20px 4px' }}>
          <div style={{ fontSize: 20, fontWeight: 800, color: '#1a1a2e' }}>{me?.name}</div>
          {me?.username && <div style={{ fontSize: 13, color: '#7C4DFF', fontWeight: 600 }}>@{me.username}</div>}
          {me?.bio && <div style={{ fontSize: 13, color: '#6b7280', marginTop: 5, lineHeight: 1.5 }}>{me.bio}</div>}
        </div>

        {/* Info chips */}
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, justifyContent: 'center', padding: '8px 16px' }}>
          {me?.relationship && <span style={{ background: '#fce4ec', color: '#e91e63', borderRadius: 20, padding: '4px 12px', fontSize: 11, fontWeight: 600 }}>❤️ {me.relationship}</span>}
          {me?.city && <span style={{ background: '#e8eaf6', color: '#5e35b1', borderRadius: 20, padding: '4px 12px', fontSize: 11, fontWeight: 600 }}>📍 {me.city}</span>}
          {me?.company && <span style={{ background: '#e0f2f1', color: '#00796b', borderRadius: 20, padding: '4px 12px', fontSize: 11, fontWeight: 600 }}>💼 {me.company}</span>}
          {me?.university && <span style={{ background: '#fff3e0', color: '#e65100', borderRadius: 20, padding: '4px 12px', fontSize: 11, fontWeight: 600 }}>🎓 {me.university}</span>}
        </div>

        {/* Stats */}
        <div style={{ display: 'flex', justifyContent: 'center', gap: 32, padding: '12px 0 8px' }}>
          <div style={{ textAlign: 'center' }}><div style={{ fontSize: 18, fontWeight: 800, color: '#1a1a2e' }}>{(me?.friends || []).length}</div><div style={{ fontSize: 11, color: '#9ca3af' }}>Friends</div></div>
          <div style={{ textAlign: 'center' }}><div style={{ fontSize: 18, fontWeight: 800, color: '#1a1a2e' }}>{loadingPosts ? '…' : posts.length}</div><div style={{ fontSize: 11, color: '#9ca3af' }}>Posts</div></div>
          <div style={{ textAlign: 'center' }}><div style={{ fontSize: 18, fontWeight: 800, color: '#1a1a2e' }}>{loadingPosts ? '…' : posts.reduce((a, p) => a + (p.likes?.length || 0), 0)}</div><div style={{ fontSize: 11, color: '#9ca3af' }}>Likes</div></div>
        </div>

        {/* Buttons */}
        <div style={{ display: 'flex', gap: 10, padding: '4px 16px 16px' }}>
          <button className="btn-follow" onClick={() => setShowEdit(true)}>✏️ Edit Profile</button>
        </div>

        {/* Social Links */}
        {(me?.whatsapp || me?.instagram) && (
          <div style={{ display: 'flex', gap: 8, padding: '0 16px 14px', flexWrap: 'wrap' }}>
            {me.whatsapp && <a href={`https://wa.me/${me.whatsapp.replace(/\D/g,'')}`} target="_blank" style={{ display: 'flex', alignItems: 'center', gap: 5, background: '#dcfce7', color: '#16a34a', borderRadius: 20, padding: '6px 14px', fontSize: 12, fontWeight: 600, textDecoration: 'none' }}>💬 WhatsApp</a>}
            {me.instagram && <a href={`https://instagram.com/${me.instagram.replace('@','')}`} target="_blank" style={{ display: 'flex', alignItems: 'center', gap: 5, background: '#fce7f3', color: '#be185d', borderRadius: 20, padding: '6px 14px', fontSize: 12, fontWeight: 600, textDecoration: 'none' }}>📸 Instagram</a>}
          </div>
        )}

        {/* Post Tabs */}
        <div style={{ display: 'flex', borderTop: '1px solid #e8eaf6', borderBottom: '1px solid #e8eaf6', background: '#fff' }}>
          {[['all', 'All'], ['photos', '📷 Photos']].map(([id, lbl]) => (
            <div key={id} onClick={() => setPostTab(id)} style={{ flex: 1, textAlign: 'center', padding: '12px 0', fontSize: 13, fontWeight: 600, color: postTab === id ? '#7C4DFF' : '#9ca3af', borderBottom: postTab === id ? '2px solid #7C4DFF' : '2px solid transparent', cursor: 'pointer' }}>{lbl}</div>
          ))}
        </div>

        {/* Posts Grid */}
        {loadingPosts ? (
          <div style={{ textAlign:'center', padding:'40px 20px', color:'#9ca3af', fontSize:13 }}>Loading posts...</div>
        ) : (postTab === 'all' ? posts : imgPosts).length === 0 ? (
          <div className="empty-state"><div className="emoji">📷</div><p>No posts yet</p></div>
        ) : (
          <div className="photo-grid">
            {(postTab === 'all' ? posts : imgPosts).map(p => {
              const thumb = getThumb(p);
              const hasMulti = (p.images?.length || 0) > 1;
              return (
                <div key={p.id} className="photo-cell" style={{ position: 'relative' }}>
                  {thumb
                    ? <img src={thumb} style={{ width:'100%', height:'100%', objectFit:'cover' }} />
                    : <div style={{ width:'100%', height:'100%', background:'linear-gradient(135deg,#ede7ff,#fce4ec)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:12, color:'#9ca3af', padding:8, textAlign:'center' }}>{p.text?.slice(0,30)}</div>
                  }
                  {hasMulti && (
                    <div style={{ position:'absolute', top:5, right:5, background:'rgba(0,0,0,0.55)', borderRadius:6, padding:'2px 6px', color:'#fff', fontSize:11, fontWeight:700 }}>⧉ {p.images.length}</div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

// ===== VIEW PROFILE PAGE =====
function ViewProfilePage({ me, user, onBack, onChat, showToast }) {
  const [posts, setPosts] = useState([]);
  const status = (() => {
    if ((me?.friends || []).includes(user.uid)) return 'friends';
    if ((me?.sentRequests || []).includes(user.uid)) return 'sent';
    if ((me?.friendRequests || []).includes(user.uid)) return 'received';
    return 'none';
  })();

  useEffect(() => {
    const unsub = db.collection('posts')
      .where('authorId', '==', user.uid)
      .onSnapshot(snap => {
        const ps = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
        setPosts(ps);
      }, err => console.error(err));
    return unsub;
  }, [user.uid]);

  const sendRequest = async () => {
    const batch = db.batch();
    batch.update(db.collection('users').doc(me.uid), { sentRequests: firebase.firestore.FieldValue.arrayUnion(user.uid) });
    batch.update(db.collection('users').doc(user.uid), { friendRequests: firebase.firestore.FieldValue.arrayUnion(me.uid) });
    await batch.commit();
    showToast(`✅ Friend request sent to ${user.name}`);
  };

  return (
    <div>
      <div className="topbar">
        <div style={{ cursor: 'pointer' }} onClick={onBack}><Icon name="back" size={22} color="#6b7280" /></div>
        <span className="topbar-logo">{user.name}</span>
        <div style={{ width: 38 }} />
      </div>
      <div className="page-content">
        <div className="profile-cover-placeholder">🌸</div>
        <div style={{ textAlign: 'center' }}>
          <div style={{ margin: '-42px auto 0', width: 84, display: 'inline-block' }}>
            <div className="profile-main-avatar"><Avatar user={user} size={84} /></div>
          </div>
        </div>
        <div className="profile-info">
          <div className="profile-name">{user.name}</div>
          <div className="profile-bio">{user.bio || 'No bio yet'}</div>
        </div>
        <div className="profile-stats">
          <div className="profile-stat"><div className="profile-stat-val">{(user.friends || []).length}</div><div className="profile-stat-lbl">Friends</div></div>
          <div className="profile-stat"><div className="profile-stat-val">{posts.length}</div><div className="profile-stat-lbl">Posts</div></div>
        </div>
        <div className="profile-btns">
          {status === 'friends' ? (
            <button className="btn-msg" onClick={() => onChat(user)}>💬 Message</button>
          ) : status === 'sent' ? (
            <button className="btn-msg" disabled>Request Sent ✓</button>
          ) : status === 'received' ? (
            <button className="btn-follow" onClick={() => {}}>Accept Request</button>
          ) : (
            <button className="btn-follow" onClick={sendRequest}>+ Add Friend</button>
          )}
          {status === 'friends' && <button className="btn-follow">✓ Friends</button>}
        </div>
        <div className="photo-grid">
          {posts.map(p => {
            const thumb = p.images?.length ? p.images[0] : p.imageURL || '';
            const hasMulti = (p.images?.length || 0) > 1;
            return (
              <div key={p.id} className="photo-cell" style={{ position:'relative' }}>
                {thumb
                  ? <img src={thumb} style={{ width:'100%', height:'100%', objectFit:'cover' }} />
                  : <div style={{ width:'100%', height:'100%', background:'linear-gradient(135deg,#ede7ff,#fce4ec)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:12, color:'#9ca3af', padding:8, textAlign:'center' }}>{p.text?.slice(0,30)}</div>
                }
                {hasMulti && (
                  <div style={{ position:'absolute', top:5, right:5, background:'rgba(0,0,0,0.55)', borderRadius:6, padding:'2px 6px', color:'#fff', fontSize:11, fontWeight:700 }}>⧉ {p.images.length}</div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
